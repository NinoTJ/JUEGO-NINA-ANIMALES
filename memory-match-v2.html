<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nina's World - Memory Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-main: #6C5CE7;
            --purple-dark: #4834D4;
            --purple-light: #A29BFE;
            --yellow-bright: #FDCB6E;
            --yellow-dark: #E1B12C;
            --pink-accent: #FD79A8;
            --blue-sky: #74B9FF;
            --green-mint: #55E6C1;
            --card-back-bg: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            --board-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #2A085C 0%, #482279 35%, #6B3BA7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: #FFF;
        }

        .watermark-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.06;
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 40px,
                rgba(255, 255, 255, 0.8) 40px,
                rgba(255, 255, 255, 0.8) 80px
            );
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .watermark-text {
            transform: rotate(-25deg);
            padding: 30px;
            white-space: nowrap;
        }

        /* Ambient animated sky elements */
        .sun-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(253, 203, 110, 0.35) 0%, rgba(253, 203, 110, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            pointer-events: none;
            z-index: 1;
            animation: moveCloud linear infinite;
        }

        .cloud1 { width: 120px; height: 40px; top: 10%; left: -150px; animation-duration: 28s; }
        .cloud2 { width: 200px; height: 60px; top: 25%; left: -250px; animation-duration: 38s; animation-delay: 5s; }

        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 300px)); }
        }

        .game-container {
            width: 100%;
            max-width: 960px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-title {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 700;
            text-transform: uppercase;
            color: var(--yellow-bright);
            text-shadow: 
                0 4px 0 var(--yellow-dark),
                0 8px 0 #8c4200,
                0 10px 15px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
            transform: perspective(300px) rotateX(10deg);
        }

        .hud-bar {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 15, 60, 0.75);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .lives-container {
            display: flex;
            gap: 6px;
        }

        .heart {
            font-size: 1.6rem;
            filter: drop-shadow(0 3px 0 #b30000);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart.lost {
            animation: breakHeart 0.6s forwards ease-in-out;
            filter: grayscale(1) opacity(0.4);
        }

        @keyframes breakHeart {
            0% { transform: scale(1); }
            30% { transform: scale(1.4) rotate(15deg); }
            60% { transform: scale(0.8) rotate(-15deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 140px;
        }

        .timer-bar-outer {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
        }

        .timer-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--green-mint) 0%, var(--yellow-bright) 70%, #ff4757 100%);
            border-radius: 8px;
            transition: width 1s linear;
        }

        .timer-text {
            font-size: 1.1rem;
            min-width: 38px;
            text-align: right;
            color: var(--yellow-bright);
        }

        .stage-3d {
            width: 100%;
            background: linear-gradient(180deg, rgba(85, 45, 145, 0.8) 0%, rgba(50, 20, 95, 0.9) 100%);
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 4px 8px rgba(255, 255, 255, 0.3),
                inset 0 -8px 16px rgba(0, 0, 0, 0.4);
            position: relative;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            perspective: 1200px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Responsive grid adjustment */
        @media (max-width: 650px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .stage-3d {
                padding: 14px;
                border-radius: 24px;
            }
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
        }

        .card {
            aspect-ratio: 3 / 4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 
                0 8px 0 #2a0845,
                0 12px 20px rgba(0, 0, 0, 0.4);
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card:active {
            transform: translateY(2px);
            box-shadow: 
                0 4px 0 #2a0845,
                0 6px 10px rgba(0, 0, 0, 0.3);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg) scale(0.96);
            cursor: default;
            animation: matchPulse 0.8s ease forwards;
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.12); box-shadow: 0 0 30px var(--yellow-bright); }
            100% { transform: rotateY(180deg) scale(0.98); opacity: 0.9; }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            overflow: hidden;
        }

        .card-back {
            background: var(--card-back-bg);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -4px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-back-pattern {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .card-back-icon {
            width: 36px;
            height: 36px;
            fill: #FFF;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .card-front {
            background: linear-gradient(180deg, #FFFFFF 0%, #F0F3F8 100%);
            transform: rotateY(180deg);
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.9), inset 0 -4px 6px rgba(0, 0, 0, 0.1);
            color: #2D3436;
        }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.15));
            transition: transform 0.3s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-text {
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            font-weight: 700;
            color: #4834D4;
            text-align: center;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
            word-break: break-word;
            padding: 5px;
        }

        /* Badge overlay on text cards */
        .text-card-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #E0E7FF;
            color: var(--purple-dark);
            border-radius: 10px;
            font-size: 0.7rem;
            padding: 2px 6px;
            font-weight: 700;
        }

        .nina-mascot-container {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }

        .speech-bubble {
            background: #FFF;
            color: #2D3436;
            padding: 10px 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            margin-bottom: 8px;
            position: relative;
            transform-origin: bottom right;
            animation: bubbleBounce 3s infinite ease-in-out;
            max-width: 180px;
            text-align: center;
            border: 3px solid var(--purple-main);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 25px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #FFF transparent;
            display: block;
            width: 0;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        .nina-img {
            width: clamp(80px, 15vw, 130px);
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
            animation: ninaIdle 4s infinite ease-in-out;
            pointer-events: auto;
            cursor: pointer;
        }

        @keyframes ninaIdle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 5, 30, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(180deg, #5F27CD 0%, #341F97 100%);
            border: 4px solid var(--yellow-bright);
            border-radius: 36px;
            padding: 35px 25px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.6),
                inset 0 4px 8px rgba(255, 255, 255, 0.3);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 2.8rem;
            color: var(--yellow-bright);
            text-transform: uppercase;
            text-shadow: 0 4px 0 var(--yellow-dark), 0 6px 12px rgba(0,0,0,0.4);
            margin-bottom: 12px;
        }

        .modal-subtitle {
            font-size: 1.2rem;
            color: #E0E7FF;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            padding: 15px 20px;
            width: 100%;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-val {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--green-mint);
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: #A29BFE;
            text-transform: uppercase;
        }

        /* Buttons Styling */
        .btn-3d {
            background: linear-gradient(180deg, #10AC84 0%, #1DD1A1 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 6px 0 #0E8668,
                0 10px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 #0E8668,
                0 12px 24px rgba(0, 0, 0, 0.35);
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 #0E8668,
                0 4px 10px rgba(0, 0, 0, 0.2);
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 300;
        }
    </style>
</head>
<body>

    <div class="watermark-bg">
        <div class="watermark-text">Nina's World</div>
        <div class="watermark-text">Nina's World</div>
        <div class="watermark-text">Nina's World</div>
        <div class="watermark-text">Nina's World</div>
        <div class="watermark-text">Nina's World</div>
        <div class="watermark-text">Nina's World</div>
    </div>

    <div class="sun-glow"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <canvas id="confetti-canvas"></canvas>

    <div class="game-container">
        <!-- Game Header -->
        <header class="header">
            <h1 class="logo-title">Memory Match</h1>
            
            <div class="hud-bar">
                <!-- Lives -->
                <div class="hud-item">
                    <span>Lives:</span>
                    <div class="lives-container" id="lives-box">
                        <span class="heart">❤️</span>
                        <span class="heart">❤️</span>
                        <span class="heart">❤️</span>
                    </div>
                </div>

                <!-- Timer -->
                <div class="hud-item timer-box">
                    <span>⏱️</span>
                    <div class="timer-bar-outer">
                        <div class="timer-bar-inner" id="timer-bar"></div>
                    </div>
                    <span class="timer-text" id="timer-text">90s</span>
                </div>
            </div>
        </header>

        <!-- 3D Card Stage -->
        <main class="stage-3d">
            <div class="grid" id="card-grid">
                <!-- Cards will be dynamically generated by JS -->
            </div>
        </main>
    </div>

    <div class="nina-mascot-container">
        <div class="speech-bubble" id="nina-bubble">Find all animal pairs! 🐶</div>
        <img src="images/Gemini_Generated_Image_1rkoqs1rkoqs1rko-removebg-preview.png" alt="Nina Mascot" class="nina-img" id="nina-avatar" onerror="this.src='https://placehold.co/150x200/6C5CE7/ffffff?text=Nina';">
    </div>

    <!-- Win Modal -->
    <div class="overlay" id="win-modal">
        <div class="modal-card">
            <h2 class="modal-title">You Win! 🎉</h2>
            <p class="modal-subtitle">Great job! You found all the animals!</p>
            
            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-val" id="final-time">0s</span>
                    <span class="stat-lbl">Time Left</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="final-lives">3</span>
                    <span class="stat-lbl">Lives Saved</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="final-score">1000</span>
                    <span class="stat-lbl">Score</span>
                </div>
            </div>

            <button class="btn-3d" id="btn-win-replay">Play Again 🚀</button>
        </div>
    </div>

    <!-- Game Over / Time Up Modal -->
    <div class="overlay" id="lose-modal">
        <div class="modal-card">
            <h2 class="modal-title" id="lose-title">Time's Up!</h2>
            <p class="modal-subtitle" id="lose-msg">Don't give up! Try again, you can do it! 💪</p>

            <button class="btn-3d" id="btn-lose-retry">Try Again 🔄</button>
        </div>
    </div>

    <script>
        /* ============================================================
           1. GAME CONFIGURATION & ANIMAL DATABASE
           ============================================================ */
        const CONFIG = {
            pairCount: 6,         // Number of pairs per game session (12 total cards)
            totalTime: 150,       // Game duration in seconds
            maxLives: 6,          // Total hearts
            flipDelay: 1000       // Delay before turning wrong cards back (ms)
        };

        // Master array of available animals (easy to expand)
        const ANIMALS_DB = [
            { id: 'lion', name: 'Lion', img: 'images/12 LION.png' },
            { id: 'elephant', name: 'Elephant', img: 'images/13 ELEPHANT.png' },
            { id: 'monkey', name: 'Monkey', img: 'images/17 MONKEY.png' },
            { id: 'giraffe', name: 'Giraffe', img: 'images/15 GIRAFFE.png' },
            { id: 'tiger', name: 'Tiger', img: 'images/14 TIGER.png' },
            { id: 'zebra', name: 'Zebra', img: 'images/16  ZEBRA.png' },
            { id: 'bear', name: 'Bear', img: 'images/18 BEAR.png' },
            { id: 'rabbit', name: 'Rabbit', img: 'images/7 RABBIT.png' },
            { id: 'dog', name: 'Dog', img: 'images/2 DOG.png' },
            { id: 'cat', name: 'Cat', img: 'images/1 CAT.png' },
            { id: 'duck', name: 'Duck', img: 'images/8 DUCK.png' },
            { id: 'penguin', name: 'Penguin', img: 'images/28 PENGUIN.png' }
        ];

        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playTone(freq, type, duration, gainVal = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playFlip() {
                this.init();
                this.playTone(400, 'sine', 0.1, 0.1);
            }

            playMatch() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                this.playTone(523.25, 'triangle', 0.15, 0.15); // C5
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15, 0.15), 100); // E5
                setTimeout(() => this.playTone(783.99, 'triangle', 0.3, 0.2), 200);  // G5
            }

            playWrong() {
                this.init();
                this.playTone(220, 'sawtooth', 0.2, 0.15);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 150);
            }

            playWin() {
                this.init();
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.25, 0.2), idx * 120);
                });
            }
        }

        const audio = new SoundFX();

        let cardsArr = [];
        let flippedCards = [];
        let matchedCount = 0;
        let lives = CONFIG.maxLives;
        let timeRemaining = CONFIG.totalTime;
        let timerInterval = null;
        let isLockBoard = false;
        let gameActive = false;

        // DOM elements
        const cardGrid = document.getElementById('card-grid');
        const livesBox = document.getElementById('lives-box');
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const ninaBubble = document.getElementById('nina-bubble');
        const winModal = document.getElementById('win-modal');
        const loseModal = document.getElementById('lose-modal');
        const loseTitle = document.getElementById('lose-title');
        const loseMsg = document.getElementById('lose-msg');

        function initGame() {
            // Reset state
            matchedCount = 0;
            lives = CONFIG.maxLives;
            timeRemaining = CONFIG.totalTime;
            flippedCards = [];
            isLockBoard = false;
            gameActive = true;

            // Close modals
            winModal.classList.remove('active');
            loseModal.classList.remove('active');

            // Render HUD
            updateLivesHUD();
            updateTimerHUD();

            // Select random subset of animals
            const shuffledAnimals = [...ANIMALS_DB].sort(() => 0.5 - Math.random());
            const selectedAnimals = shuffledAnimals.slice(0, CONFIG.pairCount);

            // Create deck: Each animal produces 1 Image Card + 1 Text Card
            let deck = [];
            selectedAnimals.forEach(animal => {
                deck.push({
                    pairId: animal.id,
                    type: 'image',
                    content: animal.img,
                    name: animal.name
                });
                deck.push({
                    pairId: animal.id,
                    type: 'text',
                    content: animal.name,
                    name: animal.name
                });
            });

            // Shuffle deck
            cardsArr = deck.sort(() => 0.5 - Math.random());

            // Build DOM cards
            renderGrid();

            // Start Countdown Timer
            clearInterval(timerInterval);
            timerInterval = setInterval(handleTimerTick, 1000);

            // Nina dialogue
            setNinaSpeech("Find all animal pairs! 🐶");
        }

        function renderGrid() {
            cardGrid.innerHTML = '';

            cardsArr.forEach((cardData, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.index = index;
                cardEl.dataset.pairId = cardData.pairId;

                // Card Front Content
                let frontInnerHTML = '';
                if (cardData.type === 'image') {
                    // SVG Pawprint placeholder image generator as fallback
                    const fallbackImg = `https://placehold.co/200x200/a29bfe/ffffff?text=${cardData.name}`;
                    frontInnerHTML = `<img src="${cardData.content}" alt="${cardData.name}" class="card-img" onerror="this.src='${fallbackImg}'">`;
                } else {
                    frontInnerHTML = `
                        <span class="text-card-badge">WORD</span>
                        <div class="card-text">${cardData.content}</div>
                    `;
                }

                cardEl.innerHTML = `
                    <div class="card-face card-back">
                        <div class="card-back-pattern">
                            <svg class="card-back-icon" viewBox="0 0 24 24">
                                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6E10.89,6 10,6.89 10,8E10,9.11 10.89,10 12,10E13.11,10 14,9.11 14,8E14,6.89 13.11,6 12,6Z" />
                            </svg>
                        </div>
                    </div>
                    <div class="card-face card-front">
                        ${frontInnerHTML}
                    </div>
                `;

                // Add Touch & Click event handlers
                cardEl.addEventListener('click', () => handleCardClick(cardEl, index));

                cardGrid.appendChild(cardEl);
            });
        }

        function handleCardClick(cardEl, index) {
            if (!gameActive || isLockBoard) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            // Audio feedback
            audio.playFlip();

            // Flip Card
            cardEl.classList.add('flipped');
            flippedCards.push({ element: cardEl, data: cardsArr[index] });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            const [first, second] = flippedCards;

            const isMatch = (first.data.pairId === second.data.pairId) && (first.element !== second.element);

            if (isMatch) {
                // MATCH SUCCESS
                setTimeout(() => {
                    audio.playMatch();
                    first.element.classList.add('matched');
                    second.element.classList.add('matched');
                    
                    matchedCount++;
                    flippedCards = [];
                    isLockBoard = false;

                    // Trigger mini celebratory confetti pop over cards
                    triggerMatchConfetti(first.element, second.element);

                    setNinaSpeech(`Awesome! That's a ${first.data.name}! 🌟`);

                    // Check Win Condition
                    if (matchedCount === CONFIG.pairCount) {
                        handleVictory();
                    }
                }, 300);

            } else {
                // MISMATCH FAILURE
                setTimeout(() => {
                    audio.playWrong();
                    
                    // Deduct life
                    lives--;
                    updateLivesHUD();

                    // Shake cards before flipping back
                    first.element.classList.add('shake');
                    second.element.classList.add('shake');

                    setTimeout(() => {
                        first.element.classList.remove('flipped', 'shake');
                        second.element.classList.remove('flipped', 'shake');
                        flippedCards = [];
                        isLockBoard = false;

                        if (lives <= 0) {
                            handleGameOver("Out of Lives!");
                        } else {
                            setNinaSpeech("Try again, you can do it! 💪");
                        }
                    }, CONFIG.flipDelay);

                }, 400);
            }
        }

        function handleTimerTick() {
            if (!gameActive) return;
            timeRemaining--;
            updateTimerHUD();

            if (timeRemaining <= 0) {
                handleGameOver("Time's Up!");
            }
        }

        function updateTimerHUD() {
            timerText.textContent = `${timeRemaining}s`;
            const pct = Math.max(0, (timeRemaining / CONFIG.totalTime) * 100);
            timerBar.style.width = `${pct}%`;
        }

        function updateLivesHUD() {
            const heartEls = livesBox.querySelectorAll('.heart');
            heartEls.forEach((el, idx) => {
                if (idx >= lives) {
                    el.classList.add('lost');
                } else {
                    el.classList.remove('lost');
                }
            });
        }

        function setNinaSpeech(text) {
            ninaBubble.textContent = text;
        }

        function handleVictory() {
            gameActive = false;
            clearInterval(timerInterval);
            audio.playWin();

            // Calculate simple score
            const score = (timeRemaining * 10) + (lives * 100) + 500;

            document.getElementById('final-time').textContent = `${timeRemaining}s`;
            document.getElementById('final-lives').textContent = `${lives} ❤️`;
            document.getElementById('final-score').textContent = score;

            setNinaSpeech("You are super smart! 🎉");
            
            // Full celebratory confetti
            triggerFullConfetti();

            setTimeout(() => {
                winModal.classList.add('active');
            }, 600);
        }

        function handleGameOver(reason) {
            gameActive = false;
            clearInterval(timerInterval);

            loseTitle.textContent = reason === "Out of Lives!" ? "Game Over! 💔" : "Time's Up! ⏱️";
            loseMsg.textContent = "Don't give up! Try again, you can do it! 💪";

            setNinaSpeech("Let's try again together! ✨");

            setTimeout(() => {
                loseModal.classList.add('active');
            }, 600);
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticle(x, y) {
            const colors = ['#FDCB6E', '#E1B12C', '#FD79A8', '#74B9FF', '#55E6C1', '#A29BFE'];
            return {
                x: x || Math.random() * canvas.width,
                y: y || Math.random() * canvas.height * 0.3,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 8,
                vy: Math.random() * -6 - 2,
                gravity: 0.2,
                rotation: Math.random() * 360,
                vRot: (Math.random() - 0.5) * 10,
                opacity: 1
            };
        }

        function triggerMatchConfetti(el1, el2) {
            const rect1 = el1.getBoundingClientRect();
            const rect2 = el2.getBoundingClientRect();
            const cx = (rect1.left + rect2.left) / 2 + 30;
            const cy = (rect1.top + rect2.top) / 2 + 40;

            for (let i = 0; i < 25; i++) {
                particles.push(createParticle(cx, cy));
            }
        }

        function triggerFullConfetti() {
            for (let i = 0; i < 120; i++) {
                particles.push(createParticle());
            }
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, idx) => {
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.vRot;
                p.opacity -= 0.008;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.opacity <= 0 || p.y > canvas.height) {
                    particles.splice(idx, 1);
                }
            });

            requestAnimationFrame(renderConfetti);
        }
        renderConfetti();

        document.getElementById('btn-win-replay').addEventListener('click', initGame);
        document.getElementById('btn-lose-retry').addEventListener('click', initGame);

        // Mascot interactive bounce
        document.getElementById('nina-avatar').addEventListener('click', () => {
            audio.playFlip();
            setNinaSpeech("Hi! I'm Nina! Let's play! 🎈");
        });

        // Initialize on load
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
