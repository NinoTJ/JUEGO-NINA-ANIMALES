<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Nina's World - Memory Match</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Orbitron:wght@600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --bg-base: #050816;
            --cyan-neon: #22d3ee;
            --cyan-glow: rgba(34, 211, 238, 0.4);
            --pink-neon: #ff2d95;
            --pink-glow: rgba(255, 45, 149, 0.4);
            --purple-neon: #a855f7;
            --yellow-neon: #facc15;
            --green-neon: #4ade80;
            --panel-bg: rgba(13, 20, 48, 0.75);
            --panel-border: rgba(34, 211, 238, 0.35);
            --card-back-bg: linear-gradient(145deg, #0f1738 0%, #171238 60%, #1f0f35 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(34, 211, 238, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(255, 45, 149, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 35%),
                linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 4px 8px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            color: #FFF;
        }

        .ambient-glow-top {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 350px;
            background: radial-gradient(ellipse, rgba(34, 211, 238, 0.18) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            position: relative;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        /* Compact Header */
        .header {
            flex-shrink: 0;
            padding: 4px 12px 2px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .top-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nw-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6 0%, #a855f7 60%, #ec4899 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            letter-spacing: -0.5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
        }

        .brand-meta-top {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .brand-nina {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .brand-world {
            color: var(--cyan-neon);
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .mode-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--cyan-neon);
            background: rgba(34, 211, 238, 0.12);
            border: 1px solid rgba(34, 211, 238, 0.4);
            padding: 1px 6px;
            border-radius: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* Center Title */
        .title-box {
            text-align: center;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 2.6vh, 1.8rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
            line-height: 1.1;
        }

        .logo-title span {
            color: var(--cyan-neon);
            text-shadow: 0 0 18px rgba(34, 211, 238, 0.8);
        }

        .instructions-sub {
            font-size: clamp(0.65rem, 1.3vh, 0.8rem);
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        /* HUD bar */
        .hud-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(13, 20, 48, 0.75);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            padding: 3px 14px;
            height: 34px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 0.8px;
        }

        .lives-container {
            display: flex;
            gap: 3px;
            align-items: center;
        }

        .heart {
            font-size: 1rem;
            filter: drop-shadow(0 0 5px rgba(255, 45, 149, 0.8));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            line-height: 1;
        }

        .heart.lost {
            animation: breakHeart 0.6s forwards ease-in-out;
            filter: grayscale(1) opacity(0.25);
            text-shadow: none;
        }

        @keyframes breakHeart {
            0% { transform: scale(1); }
            30% { transform: scale(1.35) rotate(15deg); }
            60% { transform: scale(0.75) rotate(-15deg); }
            100% { transform: scale(0.9) rotate(0); }
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timer-bar-outer {
            width: 75px;
            height: 8px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(34, 211, 238, 0.3);
            position: relative;
        }

        .timer-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--cyan-neon) 0%, var(--purple-neon) 60%, var(--pink-neon) 100%);
            border-radius: 999px;
            box-shadow: 0 0 8px var(--cyan-neon);
            transition: width 1s linear;
        }

        .timer-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            min-width: 30px;
            text-align: right;
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        /* 3D Card Stage */
        .stage-3d {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            padding: 8px 14px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
            background: rgba(13, 20, 48, 0.65);
            border: 2px solid rgba(34, 211, 238, 0.3);
            border-radius: 20px;
            box-shadow: 
                0 12px 32px rgba(0, 0, 0, 0.65),
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                0 0 16px rgba(34, 211, 238, 0.08);
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            height: 100%;
            max-height: calc(100dvh - 110px);
            justify-items: center;
            align-items: center;
            perspective: 1200px;
        }

        @media (max-width: 768px) {
            .grid {
                gap: 10px;
                max-height: calc(100dvh - 115px);
            }
        }

        @media (max-width: 580px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 8px;
                width: 100%;
                height: 100%;
                max-height: calc(100dvh - 100px);
            }
            .stage-3d {
                padding: 6px 8px;
                border-radius: 16px;
            }
            .top-row {
                flex-direction: row;
                justify-content: space-between;
            }
            .hud-bar {
                height: 30px;
                padding: 2px 10px;
                gap: 8px;
            }
            .timer-bar-outer {
                width: 55px;
            }
        }

        /* The Cards */
        .card {
            aspect-ratio: 3 / 4;
            max-height: calc((100dvh - 130px) / 3);
            height: 100%;
            max-width: 100%;
            width: auto;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
            cursor: pointer;
            border-radius: 14px;
            margin: 0 auto;
            box-shadow: 
                0 4px 0 rgba(7, 11, 30, 0.9),
                0 8px 16px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 580px) {
            .card {
                max-height: calc((100dvh - 120px) / 4);
            }
        }

        .card:hover:not(.flipped):not(.matched) {
            transform: translateY(-3px);
            box-shadow: 
                0 6px 0 rgba(7, 11, 30, 0.9),
                0 10px 20px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(34, 211, 238, 0.3);
        }

        .card:active:not(.matched) {
            transform: translateY(1px);
            box-shadow: 
                0 2px 0 rgba(7, 11, 30, 0.9),
                0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
            pointer-events: none;
        }

        .card.matched .card-front {
            border-color: var(--green-neon);
            box-shadow: 
                inset 0 0 12px rgba(74, 222, 128, 0.35),
                0 0 16px rgba(74, 222, 128, 0.65),
                0 0 26px rgba(74, 222, 128, 0.3);
        }

        .card.shake {
            animation: cyberShake 0.6s ease-in-out;
        }

        .card.shake .card-front {
            border-color: var(--pink-neon);
            box-shadow: 
                inset 0 0 12px rgba(255, 45, 149, 0.35),
                0 0 18px rgba(255, 45, 149, 0.75);
        }

        @keyframes cyberShake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20% { transform: rotateY(180deg) translateX(-6px); }
            40% { transform: rotateY(180deg) translateX(6px); }
            60% { transform: rotateY(180deg) translateX(-5px); }
            80% { transform: rotateY(180deg) translateX(5px); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            overflow: hidden;
            border: 1.5px solid rgba(34, 211, 238, 0.4);
        }

        /* Card Back (Dark Cyber Neon) */
        .card-back {
            background: var(--card-back-bg);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2),
                inset 0 -2px 8px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 6px 6px 6px;
            position: relative;
        }

        .card-back::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px dashed rgba(34, 211, 238, 0.22);
            border-radius: 10px;
            pointer-events: none;
        }

        .card-back-pattern {
            width: 85%;
            height: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 75%);
            border-radius: 10px;
        }

        .card-back-nina-img {
            max-width: 80%;
            max-height: 60%;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4));
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--cyan-neon);
            text-shadow: 0 0 6px var(--cyan-glow);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            white-space: nowrap;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            z-index: 2;
        }

        /* Card Front (Revealed) */
        .card-front {
            background: linear-gradient(165deg, rgba(20, 27, 60, 0.95) 0%, rgba(10, 14, 38, 0.98) 100%);
            transform: rotateY(180deg);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                inset 0 0 16px rgba(7, 10, 28, 0.8);
            border-color: rgba(34, 211, 238, 0.55);
            color: #FFF;
            visibility: hidden;
            position: relative;
        }

        .card.flipped .card-front,
        .card.matched .card-front {
            visibility: visible;
        }

        .card.flipped .card-back,
        .card.matched .card-back {
            visibility: hidden;
        }

        /* Image Card */
        .card-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            margin: auto;
            display: block;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 8px rgba(34, 211, 238, 0.25));
            transition: transform 0.3s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        /* Word Card */
        .card-text {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(0.75rem, 1.8vh, 1.15rem);
            font-weight: 700;
            color: #22d3ee;
            text-align: center;
            line-height: 1.15;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
            padding: 4px;
            max-width: 100%;
            word-break: break-word;
        }

        .text-card-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(168, 85, 247, 0.25);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 5px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            box-shadow: 0 0 6px rgba(168, 85, 247, 0.4);
        }

        /* Mascot Nina */
        .nina-mascot-container {
            position: fixed;
            bottom: 8px;
            right: 10px;
            z-index: 90;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }

        .speech-bubble {
            background: rgba(13, 20, 48, 0.9);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 10px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.72rem;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55), 0 0 10px rgba(34, 211, 238, 0.3);
            margin-bottom: 4px;
            position: relative;
            transform-origin: bottom right;
            animation: bubbleBounce 3.5s infinite ease-in-out;
            max-width: 130px;
            text-align: center;
            border: 1px solid var(--cyan-neon);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 16px;
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: var(--cyan-neon) transparent;
            display: block;
            width: 0;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        .nina-img {
            width: 85px;
            height: auto;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 8px rgba(34, 211, 238, 0.3));
            animation: ninaIdle 4.5s infinite ease-in-out;
            pointer-events: auto;
            cursor: pointer;
        }

        @keyframes ninaIdle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2.5deg); }
            75% { transform: rotate(2.5deg); }
        }

        @media (max-width: 580px) {
            .nina-mascot-container {
                bottom: 4px;
                right: 6px;
            }
            .nina-img {
                width: 55px;
            }
            .speech-bubble {
                font-size: 0.65rem;
                padding: 3px 6px;
                max-width: 110px;
            }
        }

        /* Overlay & Modals */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 6, 18, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 16px;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(13, 20, 48, 0.95);
            border: 2px solid var(--cyan-neon);
            border-radius: 24px;
            padding: 26px 20px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(34, 211, 238, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transform: scale(0.85) translateY(15px);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 12px var(--cyan-neon), 0 0 24px var(--cyan-glow);
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .stats-box {
            background: rgba(7, 11, 30, 0.7);
            border-radius: 16px;
            padding: 12px 16px;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(34, 211, 238, 0.25);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .stat-lbl {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Buttons Styling */
        .btn-3d {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 12px 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 
                0 0 16px rgba(6, 182, 212, 0.55),
                0 5px 14px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: all 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 0 24px rgba(6, 182, 212, 0.8),
                0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .btn-3d:active {
            transform: translateY(2px);
            box-shadow: 
                0 0 12px rgba(6, 182, 212, 0.5),
                0 3px 6px rgba(0, 0, 0, 0.4);
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 300;
        }
    
/* ===== Ajustes: imagen grande, Nina grande en el reverso, caras apiladas ===== */
.card-face { top: 0; left: 0; padding: 3px; }
.card-back { position: absolute; justify-content: center; padding: 3px; }
.card-front { position: absolute; }
.card-img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; margin: 0; }
.card-back-pattern { width: 94%; height: 94%; }

<script>
        /* ============================================================

        const CONFIG = {

            totalTime: 180,       // Game duration in seconds

        // Master array of available animals (easy to expand)
        const ANIMALS_DB = [

            { id: 'koala', name: 'Koala', img: 'images/24%20KOALA.png', crop: 'inset(2.6% 22.4% 0.0% 26.7%)' },
            { id: 'hedgehog', name: 'Hedgehog', img: 'images/46%20HEDGEHOG.png', crop: 'inset(3.7% 19.9% 4.2% 20.3%)' },
            { id: 'squirrel', name: 'Squirrel', img: 'images/50%20SQUIRREL.png', crop: 'inset(3.4% 20.0% 1.8% 14.7%)' },
            { id: 'bird', name: 'Bird', img: 'images/26%20BIRD.png', crop: 'inset(5.6% 31.9% 5.8% 24.3%)' },
            { id: 'penguin', name: 'Penguin', img: 'images/28%20PENGUIN.png', crop: 'inset(3.7% 27.6% 0.1% 27.9%)' },
            { id: 'butterfly', name: 'Butterfly', img: 'images/29%20BUTTERFLAY.png', crop: 'inset(2.9% 19.2% 1.5% 18.4%)' },
            { id: 'bee', name: 'Bee', img: 'images/30%20BEE.png', crop: 'inset(5.3% 25.1% 0.7% 30.2%)' },
            { id: 'ladybug', name: 'Ladybug', img: 'images/31%20LADYBUG.png', crop: 'inset(1.5% 21.4% 5.3% 22.8%)' }
        ];

        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playTone(freq, type, duration, gainVal = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playFlip() {
                this.init();
                this.playTone(400, 'sine', 0.1, 0.1);
            }

            playMatch() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                this.playTone(523.25, 'triangle', 0.15, 0.15); // C5
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15, 0.15), 100); // E5
                setTimeout(() => this.playTone(783.99, 'triangle', 0.3, 0.2), 200);  // G5
            }

            playWrong() {
                this.init();
                this.playTone(220, 'sawtooth', 0.2, 0.15);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 150);
            }

            playWin() {
                this.init();
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.25, 0.2), idx * 120);
                });
            }
        }

        const audio = new SoundFX();

        let cardsArr = [];
        let flippedCards = [];
        let matchedCount = 0;
        let mistakes = 0;
        let timeRemaining = CONFIG.totalTime;
        let timerInterval = null;
        let isLockBoard = false;
        let gameActive = false;

        // DOM elements
        const cardGrid = document.getElementById('card-grid');
                const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const ninaBubble = document.getElementById('nina-bubble');
        const winModal = document.getElementById('win-modal');
        const loseModal = document.getElementById('lose-modal');
        const loseTitle = document.getElementById('lose-title');
        const loseMsg = document.getElementById('lose-msg');


        // Reparto sin repetir: se barajan los 50 animales y se reparten de a 6
        let animalDeck = [];
        function dealAnimals(count) {
            if (animalDeck.length < count) {
                animalDeck = [...ANIMALS_DB];
                for (let i = animalDeck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [animalDeck[i], animalDeck[j]] = [animalDeck[j], animalDeck[i]];
                }
            }
            return animalDeck.splice(0, count);
        }

        // Ajusta cada carta al espacio real de su casillero (no se sale de la pantalla)
        function fitCards() {
            const cs = getComputedStyle(cardGrid);
            const cols = cs.gridTemplateColumns.split(' ').length;
            const rows = cs.gridTemplateRows.split(' ').length;
            const gap = parseFloat(cs.columnGap) || 0;
            const gw = cardGrid.clientWidth, gh = cardGrid.clientHeight;
            if (!gw || !gh) return;
            const cellW = (gw - gap * (cols - 1)) / cols;
            const cellH = (gh - gap * (rows - 1)) / rows;
            const w = Math.floor(Math.min(cellW, cellH * 0.75));
            const h = Math.floor(w / 0.75);
            cardGrid.querySelectorAll('.card').forEach(c => {
                c.style.width = w + 'px';
                c.style.height = h + 'px';
                c.style.maxHeight = 'none';
                c.style.aspectRatio = 'auto';
            });
            // Tamaño del nombre: lo más grande posible sin salirse de la carta
            cardGrid.querySelectorAll('.card-text').forEach(el => {
                const len = Math.max(el.textContent.length, 3);
                const fs = Math.max(11, Math.min(w * 0.27, (w * 0.86) / (len * 0.62)));
                el.style.fontSize = fs + 'px';
            });
            cardGrid.querySelectorAll('.text-card-badge').forEach(el => {
                el.style.fontSize = Math.max(7, Math.min(10, w * 0.06)) + 'px';
            });
        }
        window.addEventListener('resize', fitCards);
        window.addEventListener('orientationchange', () => setTimeout(fitCards, 200));
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);

        function initGame() {
            // Reset state
            matchedCount = 0;
            mistakes = 0;
            timeRemaining = CONFIG.totalTime;
            flippedCards = [];
            isLockBoard = false;
            gameActive = true;

            // Close modals
            winModal.classList.remove('active');
            loseModal.classList.remove('active');

            // Render HUD
                        updateTimerHUD();

            // Select random subset of animals
            const selectedAnimals = dealAnimals(CONFIG.pairCount);

            // Create deck: Each animal produces 1 Image Card + 1 Text Card
            let deck = [];
            selectedAnimals.forEach(animal => {
                deck.push({
                    pairId: animal.id,
                    type: 'image',
                    content: animal.img,
                    crop: animal.crop,
                    name: animal.name
                });
                deck.push({
                    pairId: animal.id,
                    type: 'text',
                    content: animal.name,
                    name: animal.name
                });
            });

            // Shuffle deck
            cardsArr = deck.sort(() => 0.5 - Math.random());

            // Build DOM cards
            renderGrid();
            fitCards();

            // Start Countdown Timer
            clearInterval(timerInterval);
            timerInterval = setInterval(handleTimerTick, 1000);

            // Nina dialogue
            setNinaSpeech("Find all animal pairs! 🐶");
        }

        function renderGrid() {
            cardGrid.innerHTML = '';

            cardsArr.forEach((cardData, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.index = index;
                cardEl.dataset.pairId = cardData.pairId;

                // Card Front Content
                let frontInnerHTML = '';
                if (cardData.type === 'image') {
                    const fallbackImg = `https://placehold.co/200x200/0d1430/22d3ee?text=${cardData.name}`;
                    frontInnerHTML = `<img src="${cardData.content}" alt="${cardData.name}" class="card-img" style="object-view-box: ${cardData.crop};" onerror="this.style.objectViewBox='none'; this.src='${fallbackImg}'">`;
                } else {
                    frontInnerHTML = `
                        <span class="text-card-badge">WORD</span>
                        <div class="card-text">${cardData.content}</div>
                    `;
                }

                cardEl.innerHTML = `
                    <div class="card-face card-back">
                        <div class="card-back-pattern">
                            <img src="images/nina_new.png" alt="Nina" class="card-back-nina-img" onerror="this.style.display='none';">
                        </div>
                    </div>
                    <div class="card-face card-front">
                        ${frontInnerHTML}
                    </div>
                `;

                // Add Touch & Click event handlers
                cardEl.addEventListener('click', () => handleCardClick(cardEl, index));

                cardGrid.appendChild(cardEl);
            });
        }

        function handleCardClick(cardEl, index) {
            if (!gameActive || isLockBoard) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            // Audio feedback
            audio.playFlip();

            // Flip Card
            cardEl.classList.add('flipped');
            flippedCards.push({ element: cardEl, data: cardsArr[index] });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            const [first, second] = flippedCards;

            const isMatch = (first.data.pairId === second.data.pairId) && (first.element !== second.element);

            if (isMatch) {
                // MATCH SUCCESS
                setTimeout(() => {
                    audio.playMatch();
                    first.element.classList.add('matched');
                    second.element.classList.add('matched');
                    
                    matchedCount++;
                    flippedCards = [];
                    isLockBoard = false;

                    // Trigger mini celebratory confetti pop over cards
                    triggerMatchConfetti(first.element, second.element);

                    setNinaSpeech(`Awesome! That's a ${first.data.name}! 🌟`);

                    // Check Win Condition
                    if (matchedCount === CONFIG.pairCount) {
                        handleVictory();
                    }
                }, 300);

            } else {
                // MISMATCH FAILURE
                setTimeout(() => {
                    audio.playWrong();
                    
                    // Sin vidas: solo se cuentan los errores
                    mistakes++;

                    // Shake cards before flipping back
                    first.element.classList.add('shake');
                    second.element.classList.add('shake');

                    setTimeout(() => {
                        first.element.classList.remove('flipped', 'shake');
                        second.element.classList.remove('flipped', 'shake');
                        flippedCards = [];
                        isLockBoard = false;

                        setNinaSpeech("Try again, you can do it! 💪");
                    }, CONFIG.flipDelay);

                }, 400);
            }
        }

        function handleTimerTick() {
            if (!gameActive) return;
            timeRemaining--;
            updateTimerHUD();

            if (timeRemaining <= 0) {
                handleGameOver("Time's Up!");
            }
        }

        function updateTimerHUD() {
            timerText.textContent = `${timeRemaining}s`;
            const pct = Math.max(0, (timeRemaining / CONFIG.totalTime) * 100);
            timerBar.style.width = `${pct}%`;
        }

        function setNinaSpeech(text) {
            ninaBubble.textContent = text;
        }

        function handleVictory() {
            gameActive = false;
            clearInterval(timerInterval);
            audio.playWin();

            // Calculate simple score
            const score = (timeRemaining * 10) + Math.max(0, 600 - mistakes * 50) + 500;

            document.getElementById('final-time').textContent = `${timeRemaining}s`;
            document.getElementById('final-mistakes').textContent = mistakes;
            document.getElementById('final-score').textContent = score;

            setNinaSpeech("You are super smart! 🎉");
            
            // Full celebratory confetti
            triggerFullConfetti();

            setTimeout(() => {
                winModal.classList.add('active');
            }, 600);
        }

        function handleGameOver(reason) {
            gameActive = false;
            clearInterval(timerInterval);

            loseTitle.textContent = "Time's Up! ⏱️";
            loseMsg.textContent = "Don't give up! Try again, you can do it! 💪";

            setNinaSpeech("Let's try again together! ✨");

            setTimeout(() => {
                loseModal.classList.add('active');
            }, 600);
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticle(x, y) {
            const colors = ['#22d3ee', '#ff2d95', '#a855f7', '#facc15', '#4ade80'];
            return {
                x: x || Math.random() * canvas.width,
                y: y || Math.random() * canvas.height * 0.3,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 8,
                vy: Math.random() * -6 - 2,
                gravity: 0.2,
                rotation: Math.random() * 360,
                vRot: (Math.random() - 0.5) * 10,
                opacity: 1
            };
        }

        function triggerMatchConfetti(el1, el2) {
            const rect1 = el1.getBoundingClientRect();
            const rect2 = el2.getBoundingClientRect();
            const cx = (rect1.left + rect2.left) / 2 + 30;
            const cy = (rect1.top + rect2.top) / 2 + 40;

            for (let i = 0; i < 25; i++) {
                particles.push(createParticle(cx, cy));
            }
            startConfetti();
        }

        function triggerFullConfetti() {
            for (let i = 0; i < 120; i++) {
                particles.push(createParticle());
            }
            startConfetti();
        }

        let confettiRunning = false;
        function startConfetti() {
            if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(renderConfetti); }
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.vRot;
                p.opacity -= 0.008;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.opacity <= 0 || p.y > canvas.height) particles.splice(i, 1);
            }
            if (particles.length > 0) {
                requestAnimationFrame(renderConfetti);
            } else {
                confettiRunning = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        document.getElementById('btn-win-replay').addEventListener('click', initGame);
        document.getElementById('btn-lose-retry').addEventListener('click', initGame);

        // Mascot interactive bounce
        document.getElementById('nina-avatar').addEventListener('click', () => {
            audio.playFlip();
            setNinaSpeech("Hi! I'm Nina! Let's play! 🎈");
        });

        // Initialize on load
        window.onload = () => {
            initGame();
            // Precarga suave en segundo plano
            let k = 0;
            const warm = () => {
                if (k >= ANIMALS_DB.length) return;
                const im = new Image();
                im.src = ANIMALS_DB[k++].img;
                setTimeout(warm, 300);
            };
            setTimeout(warm, 2000);
        };
    </script>
</body></html>
