<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Match the Animal! - Nina's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --purple: #8B5CF6;
    --purple-dark: #6D28D9;
    --yellow: #FFD93D;
    --pink: #FF6FA5;
    --sky-blue: #4FC3F7;
    --sky-top: #57C4F5;
    --sky-bottom: #BEE9FF;
    --green: #58C56B;
    --green-dark: #3E9E52;
    --grass-1: #6FD37E;
    --grass-2: #4CAF50;
    --white: #FFFFFF;
    --ink: #4A3B6B;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%;
    font-family: 'Baloo 2', system-ui, sans-serif;
    overflow-x:hidden;
    touch-action: pan-y;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
  }

  /* ---------- SKY SCENE ---------- */
  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }

  .sun{
    position:absolute;
    top:6%; right:8%;
    width:110px; height:110px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #FFF6B0, var(--yellow) 60%, #FFC93D 100%);
    box-shadow: 0 0 0 14px rgba(255,217,61,0.25), 0 0 60px rgba(255,217,61,0.55);
    animation: sun-pulse 4s ease-in-out infinite;
  }

  @keyframes sun-pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }

  .cloud{
    position:absolute;
    background: #FFFFFF;
    border-radius: 50px;
    opacity:0.9;
    filter: drop-shadow(0 6px 6px rgba(80,120,160,0.15));
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#FFFFFF;
    border-radius:50%;
  }
  .cloud1{ width:110px; height:40px; top:10%; left:-20%; animation: drift 32s linear infinite; }
  .cloud1::before{ width:60px; height:60px; top:-28px; left:12px; }
  .cloud1::after{ width:45px; height:45px; top:-18px; left:60px; }

  .cloud2{ width:80px; height:32px; top:20%; left:-25%; animation: drift 24s linear infinite; animation-delay: -8s; }
  .cloud2::before{ width:45px; height:45px; top:-20px; left:8px; }
  .cloud2::after{ width:35px; height:35px; top:-14px; left:42px; }

  .cloud3{ width:130px; height:44px; top:6%; left:-30%; animation: drift 40s linear infinite; animation-delay: -20s; }
  .cloud3::before{ width:65px; height:65px; top:-32px; left:16px; }
  .cloud3::after{ width:50px; height:50px; top:-20px; left:70px; }

  @keyframes drift{
    from{ transform: translateX(0); }
    to{ transform: translateX(135vw); }
  }

  .grass{
    position:fixed;
    left:0; right:0; bottom:0;
    height:14vh;
    min-height:90px;
    z-index:1;
    background: linear-gradient(180deg, var(--grass-1), var(--grass-2));
    border-top: 6px solid #3E9E52;
    border-radius: 50% 50% 0 0 / 30px 30px 0 0;
  }

  /* ---------- WATERMARK ---------- */
  .watermark{
    position:fixed;
    left:14px; bottom:calc(14vh + 8px);
    z-index:1;
    display:flex;
    align-items:flex-end;
    gap:8px;
    opacity:0.55;
    pointer-events:none;
    filter: grayscale(0.1);
  }
  .watermark img{
    height:86px;
    width:auto;
    object-fit:contain;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
  }
  /* hide broken placeholder icon quietly if NINA_AQUI.png hasn't been replaced yet */
  .watermark img.img-missing{ display:none; }
  .watermark-text{
    font-weight:700;
    font-size:15px;
    color: var(--purple-dark);
    background: rgba(255,255,255,0.6);
    padding:3px 10px;
    border-radius:20px;
  }

  /* ---------- HEADER ---------- */
  header{
    position:relative;
    z-index:2;
    text-align:center;
    margin-top:22px;
    padding:0 16px;
  }
  h1{
    margin:0;
    font-size: clamp(24px, 5vw, 38px);
    font-weight:800;
    color: var(--purple-dark);
    text-shadow: 2px 3px 0 rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
  }
  .subtitle{
    margin:6px 0 0;
    font-size: clamp(14px, 2.6vw, 18px);
    font-weight:600;
    color: var(--ink);
    background: #FFFFFFaa;
    display:inline-block;
    padding:4px 14px;
    border-radius: 20px;
  }

  /* ---------- MAIN GAME ---------- */
  main{
    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 18px 10px 4px;
  }

  .animals-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    gap: 22px;
    width:100%;
    margin-bottom: 26px;
  }

  .animal-slot{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:150px;
  }

  .animal-stage{
    position:relative;
    width:150px;
    height:150px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .platform{
    position:absolute;
    bottom:6px;
    left:50%;
    transform: translateX(-50%);
    width:120px;
    height:32px;
    background: radial-gradient(ellipse at center, var(--green) 0%, var(--green-dark) 100%);
    border-radius:50%;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08), inset 0 -4px 6px rgba(0,0,0,0.12);
    z-index:1;
  }

  .animal-img{
    position:relative;
    z-index:2;
    max-height:140px;
    max-width:140px;
    object-fit:contain;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,0.15));
  }

  .animal-stage.img-missing::before{
    content:"🐾";
    position:relative;
    z-index:2;
    font-size:64px;
    line-height:1;
    margin-bottom: 18px;
  }

  @keyframes bounce{
    0%{ transform: translateY(0) scale(1); }
    30%{ transform: translateY(-22px) scale(1.05, 0.95); }
    50%{ transform: translateY(0) scale(0.96, 1.06); }
    70%{ transform: translateY(-8px) scale(1.02, 0.98); }
    100%{ transform: translateY(0) scale(1); }
  }
  .animal-img.bounce, .animal-stage.img-missing.bounce::before{
    animation: bounce 0.7s ease;
  }

  .drop-zone{
    margin-top:8px;
    width:128px;
    min-height:52px;
    border-radius:16px;
    border: 3px dashed var(--purple);
    background: rgba(255,255,255,0.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 4px 8px;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
  }

  .dz-question{
    font-size:26px;
    font-weight:800;
    color: var(--purple);
    opacity:0.6;
    user-select:none;
  }

  .drop-zone.correct{
    border-style: solid;
    border-color: var(--green-dark);
    background: rgba(88, 197, 107, 0.25);
  }

  .drop-zone.hover-target{
    border-color: var(--pink);
    transform: scale(1.06);
  }

  @keyframes shake{
    0%, 100%{ transform: translateX(0); }
    20%{ transform: translateX(-9px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-6px); }
    80%{ transform: translateX(5px); }
  }
  .drop-zone.shake{ animation: shake 0.45s ease; border-color: #FF5A5A; }

  /* ---------- WORD TRAY ---------- */
  .words-tray{
    width:100%;
    max-width:640px;
    background: rgba(255,255,255,0.55);
    border: 3px solid #ffffffaa;
    border-radius: 26px;
    padding: 16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
    min-height: 68px;
    backdrop-filter: blur(2px);
  }

  .word-pill{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(15px, 3.4vw, 18px);
    color:#fff;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: grab;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 6px 10px rgba(0,0,0,0.12);
    background: linear-gradient(135deg, var(--purple), var(--purple-dark));
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .word-pill:nth-child(3n+1){ background: linear-gradient(135deg, #FF8FB8, var(--pink)); }
  .word-pill:nth-child(3n+2){ background: linear-gradient(135deg, #7FDDF9, var(--sky-blue)); }
  .word-pill:nth-child(3n+3){ background: linear-gradient(135deg, #A78BFA, var(--purple)); }

  .word-pill:active{ cursor: grabbing; }
  .word-pill.dragging{
    box-shadow: 0 10px 18px rgba(0,0,0,0.25);
    transform: scale(1.08) rotate(-2deg);
    opacity:0.95;
  }

  /* ---------- CONFETTI ---------- */
  .confetti-piece{
    position:fixed;
    top:0; left:0;
    width:10px; height:14px;
    z-index: 500;
    pointer-events:none;
    animation-name: confetti-fall;
    animation-timing-function: cubic-bezier(.35,.6,.4,1);
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- VICTORY OVERLAY ---------- */
  .victory-overlay{
    position:fixed;
    inset:0;
    z-index:800;
    background: rgba(93, 52, 173, 0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    transition: opacity 0.3s ease;
  }
  .victory-overlay.hidden{ display:none; }

  .victory-card{
    background: #FFFFFF;
    border-radius: 28px;
    padding: 34px 30px;
    text-align:center;
    max-width: 360px;
    width:100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: pop-in 0.4s cubic-bezier(.26,1.4,.44,1);
  }
  @keyframes pop-in{
    from{ transform: scale(0.6); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }
  .victory-card h2{
    margin:0 0 8px;
    font-size:28px;
    color: var(--purple-dark);
    font-weight:800;
  }
  .victory-card p{
    margin:0 0 22px;
    color: var(--ink);
    font-weight:600;
  }
  #playAgainBtn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:#fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border:none;
    padding: 12px 30px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 5px 0 var(--purple-dark);
    transition: transform 0.12s ease;
  }
  #playAgainBtn:active{
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--purple-dark);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 520px){
    .animal-slot, .animal-stage{ width:120px; }
    .animal-stage{ height:120px; }
    .animal-img{ max-height:110px; max-width:110px; }
    .platform{ width:96px; height:26px; }
    .drop-zone{ width:104px; min-height:46px; }
    .watermark{ display:none; }
    .animals-row{ gap:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .sun, .cloud1, .cloud2, .cloud3, .animal-img.bounce, .drop-zone.shake{
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <div class="sky">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>

  <div class="watermark">
    <img src="NINA_AQUI.png" alt="" id="ninaWatermark">
    <span class="watermark-text">Nina's World</span>
  </div>

  <header>
    <h1>🐾 Match the Animal! 🐾</h1>
    <p class="subtitle">Drag each word to the correct animal</p>
  </header>

  <main>
    <div class="animals-row" id="animalsRow"></div>
    <div class="words-tray" id="wordsTray"></div>
  </main>

  <div class="grass"></div>

  <div class="victory-overlay hidden" id="victoryOverlay">
    <div class="victory-card">
      <h2>You did it! 🎉</h2>
      <p>You matched all the animals!</p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* =========================================================
     ANIMAL POOL
     Each round picks 3 random animals from this list, so the
     game rarely feels repeated. Image files are expected at:
       images/<Name>.png   (capitalized, transparent background)
     e.g. images/Cat.png, images/Tiger.png, images/Dolphin.png
     Replace ninaWatermark's src (NINA_AQUI.png) with your own
     character art, or remove the .watermark block if not needed.
     ========================================================= */
  const ANIMALS = [
    "Cat","Dog","Cow","Pig","Horse","Sheep","Rabbit","Duck","Chicken","Rooster",
    "Goat","Lion","Elephant","Tiger","Giraffe","Zebra","Monkey","Bear","Wolf","Fox",
    "Deer","Panda","Kangaroo","Koala","Hippo","Bird","Owl","Penguin","Butterfly","Bee",
    "Ladybug","Bat","Snail","Fish","Dolphin","Whale","Shark","Octopus","Crab","Starfish",
    "Seal","Turtle","Frog","Snake","Mouse","Hedgehog","Donkey","Camel","Rhino","Squirrel"
  ];

  const CONFETTI_COLORS = ["#8B5CF6","#FFD93D","#FF6FA5","#4FC3F7","#58C56B","#FF8FB8"];

  const animalsRow = document.getElementById("animalsRow");
  const wordsTray = document.getElementById("wordsTray");
  const victoryOverlay = document.getElementById("victoryOverlay");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const ninaWatermark = document.getElementById("ninaWatermark");

  ninaWatermark.addEventListener("error", function(){
    ninaWatermark.classList.add("img-missing");
  });

  let matchedCount = 0;
  let currentDrag = null; // { pill, offsetX, offsetY }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildAnimalSlot(name){
    const slot = document.createElement("div");
    slot.className = "animal-slot";

    const stage = document.createElement("div");
    stage.className = "animal-stage";

    const img = document.createElement("img");
    img.className = "animal-img";
    img.src = "images/" + name + ".png";
    img.alt = name;
    img.draggable = false;
    img.addEventListener("error", function(){
      stage.classList.add("img-missing");
      img.remove();
    });

    const platform = document.createElement("div");
    platform.className = "platform";

    stage.appendChild(img);
    stage.appendChild(platform);

    const dropZone = document.createElement("div");
    dropZone.className = "drop-zone";
    dropZone.dataset.animal = name;
    const q = document.createElement("span");
    q.className = "dz-question";
    q.textContent = "?";
    dropZone.appendChild(q);

    slot.appendChild(stage);
    slot.appendChild(dropZone);

    return { slot, stage, img, dropZone };
  }

  function buildWordPill(name){
    const pill = document.createElement("div");
    pill.className = "word-pill";
    pill.dataset.answer = name;
    pill.textContent = name;
    bindDragEvents(pill);
    return pill;
  }

  function startRound(){
    matchedCount = 0;
    animalsRow.innerHTML = "";
    wordsTray.innerHTML = "";
    victoryOverlay.classList.add("hidden");

    const roundAnimals = shuffle(ANIMALS).slice(0, 3);

    roundAnimals.forEach(function(name){
      const built = buildAnimalSlot(name);
      animalsRow.appendChild(built.slot);
    });

    const roundWords = shuffle(roundAnimals);
    roundWords.forEach(function(name){
      wordsTray.appendChild(buildWordPill(name));
    });
  }

  /* ---------------- DRAG & DROP (mouse + touch) ---------------- */

  function bindDragEvents(pill){
    pill.addEventListener("mousedown", function(e){ startDrag(e, pill, false); });
    pill.addEventListener("touchstart", function(e){ startDrag(e, pill, true); }, { passive: false });
  }

  function getPoint(e, isTouch){
    if(isTouch){
      const t = e.touches[0] || e.changedTouches[0];
      return { x: t.clientX, y: t.clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function startDrag(e, pill, isTouch){
    e.preventDefault();
    if(currentDrag) return;

    const point = getPoint(e, isTouch);
    const rect = pill.getBoundingClientRect();

    document.body.appendChild(pill);
    pill.style.position = "fixed";
    pill.style.width = rect.width + "px";
    pill.style.left = rect.left + "px";
    pill.style.top = rect.top + "px";
    pill.style.margin = "0";
    pill.classList.add("dragging");

    currentDrag = {
      pill: pill,
      offsetX: point.x - rect.left,
      offsetY: point.y - rect.top
    };

    if(isTouch){
      document.addEventListener("touchmove", onDragMoveTouch, { passive: false });
      document.addEventListener("touchend", onDragEndTouch);
      document.addEventListener("touchcancel", onDragEndTouch);
    } else {
      document.addEventListener("mousemove", onDragMoveMouse);
      document.addEventListener("mouseup", onDragEndMouse);
    }
  }

  function moveDraggedPill(x, y){
    if(!currentDrag) return;
    const pill = currentDrag.pill;
    pill.style.left = (x - currentDrag.offsetX) + "px";
    pill.style.top = (y - currentDrag.offsetY) + "px";
    updateHoverTarget(x, y);
  }

  function onDragMoveMouse(e){
    moveDraggedPill(e.clientX, e.clientY);
  }
  function onDragMoveTouch(e){
    e.preventDefault();
    const point = getPoint(e, true);
    moveDraggedPill(point.x, point.y);
  }

  function findDropZoneUnder(x, y, pill){
    pill.style.visibility = "hidden";
    const el = document.elementFromPoint(x, y);
    pill.style.visibility = "visible";
    return el ? el.closest(".drop-zone") : null;
  }

  function clearHoverTargets(){
    document.querySelectorAll(".drop-zone.hover-target").forEach(function(dz){
      dz.classList.remove("hover-target");
    });
  }

  function updateHoverTarget(x, y){
    clearHoverTargets();
    if(!currentDrag) return;
    const dz = findDropZoneUnder(x, y, currentDrag.pill);
    if(dz && dz.dataset.filled !== "true"){
      dz.classList.add("hover-target");
    }
  }

  function endDrag(x, y){
    if(!currentDrag) return;
    const pill = currentDrag.pill;
    clearHoverTargets();

    const dropZone = findDropZoneUnder(x, y, pill);

    document.removeEventListener("mousemove", onDragMoveMouse);
    document.removeEventListener("mouseup", onDragEndMouse);
    document.removeEventListener("touchmove", onDragMoveTouch);
    document.removeEventListener("touchend", onDragEndTouch);
    document.removeEventListener("touchcancel", onDragEndTouch);

    pill.classList.remove("dragging");
    pill.style.position = "";
    pill.style.left = "";
    pill.style.top = "";
    pill.style.width = "";
    pill.style.zIndex = "";

    if(dropZone && dropZone.dataset.filled !== "true"){
      if(dropZone.dataset.animal === pill.dataset.answer){
        handleCorrectDrop(pill, dropZone);
      } else {
        handleIncorrectDrop(pill, dropZone);
      }
    } else {
      wordsTray.appendChild(pill);
    }

    currentDrag = null;
  }

  function onDragEndMouse(e){ endDrag(e.clientX, e.clientY); }
  function onDragEndTouch(e){
    const point = getPoint(e, true);
    endDrag(point.x, point.y);
  }

  /* ---------------- OUTCOMES ---------------- */

  function handleCorrectDrop(pill, dropZone){
    dropZone.innerHTML = "";
    pill.classList.remove("dragging");
    dropZone.appendChild(pill);
    dropZone.classList.add("correct");
    dropZone.dataset.filled = "true";

    const stage = dropZone.previousElementSibling; // .animal-stage
    if(stage){
      const img = stage.querySelector(".animal-img");
      const target = img || stage;
      target.classList.add("bounce");
      setTimeout(function(){ target.classList.remove("bounce"); }, 750);
    }

    const rect = dropZone.getBoundingClientRect();
    spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 26);

    matchedCount++;
    if(matchedCount >= 3){
      setTimeout(showVictory, 650);
    }
  }

  function handleIncorrectDrop(pill, dropZone){
    dropZone.classList.add("shake");
    setTimeout(function(){ dropZone.classList.remove("shake"); }, 460);
    wordsTray.appendChild(pill);
  }

  function showVictory(){
    victoryOverlay.classList.remove("hidden");
    const w = window.innerWidth;
    spawnConfetti(w * 0.3, -10, 30);
    spawnConfetti(w * 0.7, -10, 30);
    spawnConfetti(w * 0.5, -10, 30);
  }

  /* ---------------- CONFETTI ---------------- */

  function spawnConfetti(x, y, count){
    for(let i = 0; i < count; i++){
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.background = color;
      piece.style.left = x + "px";
      piece.style.top = y + "px";
      piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";

      const dx = (Math.random() - 0.5) * 260;
      const dy = 220 + Math.random() * 220;
      const rot = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 360);
      piece.style.setProperty("--dx", dx + "px");
      piece.style.setProperty("--dy", dy + "px");
      piece.style.setProperty("--rot", rot + "deg");
      piece.style.animationDuration = (1 + Math.random() * 0.8) + "s";

      document.body.appendChild(piece);
      piece.addEventListener("animationend", function(){ piece.remove(); });
      setTimeout(function(){ if(piece.parentNode) piece.remove(); }, 2200);
    }
  }

  /* ---------------- INIT ---------------- */

  playAgainBtn.addEventListener("click", startRound);
  startRound();

})();
</script>
</body>
</html>
